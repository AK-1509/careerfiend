<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Apply - Quality Specialist - Cobalt Pharma</title><link rel="stylesheet" href="/ats/style.css"></head>
<body>
<h1>Apply: Quality Specialist</h1>
<form id="app" action="/ats/submit/single-page" method="post" enctype="multipart/form-data">
  <label for="first_name">First Name *</label><input id="first_name" name="first_name" required autocomplete="given-name">
  <label for="last_name">Last Name *</label><input id="last_name" name="last_name" required autocomplete="family-name">
  <label for="email">Email *</label><input id="email" name="email" type="email" required>
  <label for="phone">Phone</label><input id="phone" name="phone" type="tel">
  <label for="resume">Resume/CV *</label><input id="resume" name="resume" type="file" required accept=".pdf,.docx">
  <label for="cover">Cover Letter</label><input id="cover" name="cover_letter" type="file" accept=".pdf,.docx">
  <label for="linkedin">LinkedIn Profile</label><input id="linkedin" name="linkedin" type="url">
  <label for="hear">How did you hear about this job?</label>
  <select id="hear" name="hear"><option value="">Select...</option><option>Company website</option><option>LinkedIn</option><option>Referral</option><option>Other</option></select>
  <fieldset><legend>Do you have experience with GMP? *</legend>
    <label><input type="radio" name="gmp" value="yes" required> Yes</label>
    <label><input type="radio" name="gmp" value="no"> No</label>
  </fieldset>
  <label for="gender">Gender</label>
  <select id="gender" name="gender"><option value="">Select...</option><option>Male</option><option>Female</option><option>Non-binary</option><option>I don't wish to answer</option></select>
  <button type="submit">Submit Application</button>
</form>
</body></html>
