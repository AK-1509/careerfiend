<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Apply - Custom questions</title></head>
<body><h1>Apply</h1><form action="/ats/submit/custom" method="post">
<label for="n">Full name *</label><input id="n" name="n" required>
<label for="e">Email *</label><input id="e" name="e" type="email" required>
<label for="py">How many years of experience do you have with Python? *</label><input id="py" name="py" type="number" required>
<label for="ger">German language proficiency *</label>
<select id="ger" name="ger" required><option value="">Select</option><option>Basic</option><option>Conversational</option><option>Fluent</option></select>
<fieldset><legend>Do you have experience with Veeva Vault? *</legend>
<label><input type="radio" name="veeva" value="yes" required> Yes</label><label><input type="radio" name="veeva" value="no"> No</label></fieldset>
<label for="q">Describe a process you improved. *</label><textarea id="q" name="q" required></textarea>
<button type="submit">Submit application</button></form></body></html>
